name: Selene 全平台构建与发布

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libmpv-dev

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Linux
        run: flutter build linux --release

      - name: 打包
        run: |
          cd build/linux/x64/release/bundle
          tar czf selene-linux.tar.gz Selene

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: selene-linux
          path: build/linux/x64/release/bundle/selene-linux.tar.gz

  build-windows:
    name: Windows 构建
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Windows
        run: flutter build windows --release

      - name: 打包
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath selene-windows.zip

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: selene-windows
          path: selene-windows.zip

  build-apple:
    name: Apple 构建 (iOS & macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 iOS
        run: flutter build ios --release --no-codesign

      - name: 打包 iOS IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../selene-ios.ipa Payload/

      - name: 构建 macOS
        run: flutter build macos --release

      - name: 打包 macOS DMG
        run: |
          hdiutil create -volname "Selene" \
            -srcfolder build/macos/Build/Products/Release/selene.app \
            -ov -format UDZO \
            selene-macos.dmg

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: selene-apple
          path: |
            selene-ios.ipa
            selene-macos.dmg

  build-android:
    name: Android 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK 和 NDK
        uses: android-actions/setup-android@v3

      - name: 安装 NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "ndk;29.0.14033849" || true

      - name: 配置 Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: 获取依赖
        run: flutter pub get

      - name: 构建 Android 分架构 APK
        run: |
          flutter build apk --release \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols \
            --target-platform android-arm64,android-arm

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: selene-android
          path: build/app/outputs/flutter-apk/*.apk

  release:
    name: 发布到 GitHub Release
    needs: [build-linux, build-windows, build-apple, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Selene v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            artifacts/selene-android/*.apk
            artifacts/selene-linux/*.tar.gz
            artifacts/selene-windows/*.zip
            artifacts/selene-apple/*.ipa
            artifacts/selene-apple/*.dmg
