name: Flutter building (Android+iOS+macOS+Windows+Linux)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------- 1. 构建 Android(分架构) + Linux ---------------
  build-android-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Linux 依赖（已修复视频插件）
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libnotify-dev libsdl2-dev libmpv-dev

      # Java 环境
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      # 同意 Android 许可证
      - name: 同意 Android 许可证
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849"

      # Flutter 环境
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 构建 Android 分架构独立 APK
      - name: 构建 Android 分架构独立 APK
        run: flutter build apk --debug --split-per-abi

      # 🔴 关键修复1：列出APK目录，确认文件是否生成
      - name: 检查APK文件
        run: ls -la build/app/outputs/flutter-apk/

      # 构建 Linux
      - name: 构建 Linux
        run: flutter build linux --release

      # 打包 Linux
      - name: 打包 Linux
        run: zip -r linux-build.zip build/linux/x64/release/

      # 🔴 关键修复2：用通配符上传所有APK，避免路径/文件名错误
      - uses: actions/upload-artifact@v4
        with:
          name: android-linux-build
          path: |
            build/app/outputs/flutter-apk/*.apk
            linux-build.zip

  # --------------- 2. 构建 Windows ---------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 Windows
        run: flutter build windows --release
      - name: 打包 Windows
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-build.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip

  # --------------- 3. 构建 iOS + macOS ---------------
  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      # 构建 iOS（无签名）
      - name: 构建 iOS
        run: flutter build ios --debug --no-codesign
      # 构建 macOS
      - name: 构建 macOS
        run: flutter build macos --release

      # 打包
      - name: 打包 iOS & macOS
        run: |
          zip -r ios-build.zip build/ios/iphoneos/
          zip -r macos-build.zip build/macos/Build/Products/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: apple-build
          path: |
            ios-build.zip
            macos-build.zip

  # --------------- 4. 全量上传到 Release ---------------
  upload-to-release:
    needs: [build-android-linux, build-windows, build-apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 🔴 关键修复3：分目录下载，避免不同artifact的文件互相覆盖
      - name: 下载 Android + Linux
        uses: actions/download-artifact@v4
        with:
          name: android-linux-build
          path: ./packages/android-linux
      - name: 下载 Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./packages/windows
      - name: 下载 iOS + macOS
        uses: actions/download-artifact@v4
        with:
          name: apple-build
          path: ./packages/apple

      # 合并所有文件到同一个目录
      - name: 合并所有文件
        run: |
          cp ./packages/android-linux/* ./packages/
          cp ./packages/windows/* ./packages/
          cp ./packages/apple/* ./packages/

      # 上传所有文件
      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Flutter 全平台离线客户端
          body: |
            ✅ Android 分架构独立APK：
            • armv7a (32位)
            • armv8 (64位)
            • x86_64 (模拟器)
            ✅ 桌面端：Windows / macOS / Linux
            ✅ 移动端：iOS
          files: ./packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
