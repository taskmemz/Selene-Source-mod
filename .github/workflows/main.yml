name: Flutter 全平台客户端构建 (Android独立+Linux独立+全平台)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --------------- 1. 【独立】构建 Android（分架构APK）---------------
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: 同意 Android 许可证
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # 构建分架构独立APK
      - name: 构建 Android 分架构APK
        run: flutter build apk --release \
          --split-per-abi \
          --obfuscate \
          --split-debug-info=./debug-info \
          --tree-shake-icons

      # 上传【纯Android产物】独立名称
      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/*.apk

  # --------------- 2. 【独立】构建 Linux ---------------
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libgtk-3-dev liblzma-dev libsecret-1-dev libjsoncpp-dev libnotify-dev libsdl2-dev libmpv-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: 构建 Linux
        run: flutter build linux --release

      - name: 打包 Linux
        run: zip -r linux-build.zip build/linux/x64/release/

      # 上传【纯Linux产物】独立名称
      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: linux-build.zip

  # --------------- 3. 构建 Windows ---------------
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 Windows
        run: flutter build windows --release
      - name: 打包 Windows
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath windows-build.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: windows-build.zip

  # --------------- 4. 构建 iOS + macOS ---------------
  build-apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get

      - name: 构建 iOS
        run: flutter build ios --debug --no-codesign
      - name: 构建 macOS
        run: flutter build macos --release

      - name: 打包 iOS & macOS
        run: |
          zip -r ios-build.zip build/ios/iphoneos/
          zip -r macos-build.zip build/macos/Build/Products/Release/

      - uses: actions/upload-artifact@v4
        with:
          name: apple-build
          path: |
            ios-build.zip
            macos-build.zip

  # --------------- 5. 统一上传（全平台聚合，无覆盖）---------------
  upload-to-release:
    needs: [build-android, build-linux, build-windows, build-apple]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 分别下载所有独立产物，全部放到 packages 目录
      - name: 下载 Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: ./packages
      - name: 下载 Linux
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: ./packages
      - name: 下载 Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./packages
      - name: 下载 iOS+macOS
        uses: actions/download-artifact@v4
        with:
          name: apple-build
          path: ./packages

      # 上传所有产物到 Release
      - name: 上传全平台到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Flutter 全平台离线客户端
          body: |
            📱 Android 分架构APK：
            • armv7a (32位)
            • arm64-v8a (64位)
            • x86_64 (模拟器)
            🖥️ 桌面端：Windows / macOS / Linux
            📱 移动端：iOS
          files: ./packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
